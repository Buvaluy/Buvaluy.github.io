<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <title>З Днем Народження, Віка!</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', sans-serif;
      overflow-x: hidden;
      background: linear-gradient(135deg, #fff0f5, #ffe4e1);
    }

    .confetti {
      position: fixed;
      width: 100%;
      height: 100%;
      pointer-events: none;
      overflow: hidden;
      z-index: 0;
    }

    .confetti div {
      position: absolute;
      width: 10px;
      height: 10px;
      background-color: hsl(var(--hue), 70%, 60%);
      top: -20px;
      animation: fall 6s linear infinite;
      border-radius: 50%;
    }

    @keyframes fall {
      to {
        transform: translateY(100vh) rotate(360deg);
      }
    }

    .container {
      position: relative;
      z-index: 1;
      padding: 40px 20px;
      text-align: center;
    }

    h1 {
      font-size: 3.5em;
      color: #e91e63;
      animation: fadeInDown 1s ease-out;
    }

    .subtitle {
      font-size: 1.5em;
      margin-bottom: 30px;
      color: #555;
      animation: fadeInUp 1s ease-out;
    }

    .photo-placeholder {
      margin: 30px auto;
      width: 320px;
      height: 420px;
      border: 3px dashed #aaa;
      background-color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #bbb;
      font-size: 1.1em;
      border-radius: 12px;
      box-shadow: 0 0 15px rgba(0,0,0,0.1);
      animation: pulse 2s infinite;
    }

    .emoji-gallery {
      font-size: 3em;
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 30px;
      margin-top: 40px;
      animation: fadeInUp 2s ease-out;
    }

    .rainbow-text {
  background: linear-gradient(90deg, red, orange, yellow, green, blue, indigo, violet);
  background-size: 400%;
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  animation: rainbow 5s linear infinite;
}

@keyframes rainbow {
  0% { background-position: 0%; }
  100% { background-position: 100%; }
}

    .emoji {
      transition: transform 0.3s;
      cursor: default;
    }

    .emoji:hover {
      transform: scale(1.3) rotate(10deg);
    }

    .pony-block {
      font-size: 3em;
      margin-top: 80px;
      animation: float 4s ease-in-out infinite;
    }

    .typewriter {
  overflow: hidden;
  border-right: 2px solid #e91e63;
  white-space: nowrap;
  animation: typing 3s steps(30) forwards, blink 0.75s step-end infinite;
  width: 0;
}

    @keyframes typing {
  from { width: 0; }
  to { width: 300px; }
}

@keyframes blink {
  50% { border-color: transparent; }
}

    footer {
      margin-top: 60px;
      font-size: 1em;
      color: #777;
      padding-bottom: 30px;
      animation: fadeInUp 2s ease-out;
    }

    @keyframes fadeInDown {
      from { opacity: 0; transform: translateY(-50px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(50px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 15px rgba(0,0,0,0.1); }
      50%      { box-shadow: 0 0 25px rgba(255, 105, 180, 0.4); }
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50%      { transform: translateY(-10px); }
    }

    .photo-row {
  display: flex;
  justify-content: center;
  align-items: flex-start;
  gap: 30px;
  margin-top: 40px;
  flex-wrap: wrap;
}

.photo-box {
  width: 320px;
  height: 420px;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 12px;
  border: 3px dashed #aaa;
  color: #bbb;
  font-size: 1.1em;
  box-shadow: 0 0 15px rgba(0,0,0,0.1);
  opacity: 0;
  transform: translateY(30px);
  animation: fadeInPhoto 1.2s ease-out forwards;
}

@keyframes fadeInPhoto {
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

    
  </style>
</head>
<body>
  <!-- 🎊 Анімоване конфетті -->
  <div class="confetti" id="confetti"></div>

  <div class="container">
    <h1>Happy Birthday! 🎂</h1>
    <div class="subtitle" class="typewriter" class="rainbow-text">Тобі 18 – твоя чарівна історія тільки починається ✨</div>

    <!--
<div class="photo-placeholder">
      <img src="5233237880481115519.jpg" alt="Віка у ресторані" height="420" width="320" style="border-radius: 12px; box-shadow: 0 0 15px rgba(0,0,0,0.2);"/>
</div>
    -->

    <!-- 📸 Блок з трьома фото -->
<div class="photo-row">
  <div class="photo-box left" style="animation-delay: 3s;">
    <img src="left.jpg" alt="Віка у ресторані" width="320" style="border-radius: 12px; box-shadow: 0 0 15px rgba(0,0,0,0.2);"/>
  </div>
  <div class="photo-box center" style="animation-delay: 1s;">
    <!-- Фото Віки -->
    <img src="5233237880481115519.jpg" alt="Віка у ресторані"  width="320" style="border-radius: 12px; box-shadow: 0 0 15px rgba(0,0,0,0.2);"/>
  </div>
  
  <div class="photo-box right" style="animation-delay: 2s;">
    <img src="u1.jpg" alt="Віка у ресторані"  width="320" style="border-radius: 12px; box-shadow: 0 0 15px rgba(0,0,0,0.2);"/>
  </div>
  <div class="photo-box right" style="animation-delay: 4s;">
    <img src="rigth.jpg" alt="Віка у ресторані"  width="320" style="border-radius: 12px; box-shadow: 0 0 15px rgba(0,0,0,0.2);"/>
  </div>
</div>


    <!-- 🧁 Святкові emoji -->
    <div class="emoji-gallery">
      <div class="emoji">🎁</div>
      <div class="emoji">🌸</div>
      <div class="emoji">🎂</div>
      <div class="emoji">🎈</div>
      <div class="emoji">🍰</div>
      <div class="emoji">🧁</div>
      <div class="emoji">🌷</div>
    </div>

    
    <div class="pony-block">
      💗 My bestie 💗
    </div>

    <footer>
      
    </footer>
  </div>

  <!-- 🎉 JS: Генерація конфетті -->
  <script>
    const confettiContainer = document.getElementById('confetti');
    for (let i = 0; i < 100; i++) {
      const el = document.createElement('div');
      el.style.left = Math.random() * 100 + '%';
      el.style.animationDuration = (Math.random() * 3 + 3) + 's';
      el.style.opacity = Math.random();
      el.style.setProperty('--hue', Math.floor(Math.random() * 360));
      confettiContainer.appendChild(el);
    }
  </script>
</body>
</html>
