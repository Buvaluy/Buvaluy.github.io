<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Карусель</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #f5f5f5;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px;
}

h1 {
    font-size: 56px;
    margin-bottom: 40px;
    text-align: center;
}

.carousel {
    position: relative;
    width: 900px;
    max-width: 95vw;
}

.carousel img {
    width: 100%;
    height: 550px;
    object-fit: cover;
    border-radius: 12px;
    display: none;
    box-shadow: 0 8px 25px rgba(0,0,0,.25);
}

.carousel img.active {
    display: block;
    animation: fade .4s;
}

@keyframes fade {
    from {
        opacity: 0;
    }
    to {
        opacity: 1;
    }
}

button {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    width: 60px;
    height: 60px;
    border: none;
    border-radius: 50%;
    font-size: 28px;
    cursor: pointer;
    background: rgba(255,255,255,.85);
    transition: .2s;
}

button:hover {
    background: white;
    transform: translateY(-50%) scale(1.08);
}

.prev {
    left: -30px;
}

.next {
    right: -30px;
}
</style>

</head>
<body>

<h1>100 відтінків Тані</h1>

<div class="carousel">

    <button class="prev">&#10094;</button>

    <img src="TImg/photo1.bmp" class="active">
    <img src="TImg/photo2.bmp">
    <img src="TImg/photo3.bmp">
    <img src="TImg/photo4.bmp">
  <img src="TImg/photo5.bmp">
  <img src="TImg/photo6.bmp">
  <img src="TImg/photo7.bmp">
  <img src="TImg/photo8.bmp">
  <img src="TImg/photo9.bmp">
  <img src="TImg/photo10.bmp">
  <img src="TImg/photo11.bmp">
  <img src="TImg/photo12.bmp">
  <img src="TImg/photo13.bmp">
  <img src="TImg/photo14.bmp">
  <img src="TImg/photo15.bmp">
  <img src="TImg/photo16.bmp">
  <img src="TImg/photo17.bmp">
  <img src="TImg/photo18.bmp">
  <img src="TImg/photo19.bmp">
  <img src="TImg/photo20.bmp">
  <img src="TImg/photo21.bmp">
  <img src="TImg/photo22.bmp">
  

    <button class="next">&#10095;</button>

</div>

<script>

const images = document.querySelectorAll(".carousel img");
let current = 0;

function show(index){

    images[current].classList.remove("active");

    current = (index + images.length) % images.length;

    images[current].classList.add("active");
}

document.querySelector(".next").onclick = () => {
    show(current + 1);
};

document.querySelector(".prev").onclick = () => {
    show(current - 1);
};

</script>

</body>
</html>
